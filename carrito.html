HEADER
========================= -->


<header class="cart-header">

AMERIS<span>STORE</span>

</a>




<a href="index.html" class="back-button">

← Seguir comprando

</a>



</header>









<!-- =========================
CARRITO
========================= -->


<main class="cart-container">



<h1>

Mi carrito

</h1>







<section class="cart-content">





<!-- LISTA PRODUCTOS -->


<div

id="cartItems"

class="cart-items">


</div>









<!-- RESUMEN -->


<aside class="cart-summary">



<h2>

Resumen

</h2>





<div class="summary-line">


<span>

Productos

</span>


<strong id="cartCount">

0

</strong>


</div>







<div class="summary-line total">


<span>

Total

</span>


<strong id="cartTotal">

Gs. 0

</strong>


</div>







<button

id="checkoutWhatsapp"

class="checkout-button">


💬 Comprar carrito por WhatsApp


</button>







<button

id="clearCart"

class="clear-button">


Vaciar carrito


</button>





</aside>







</section>







</main>

<a

href="https://wa.me/595981841136"
